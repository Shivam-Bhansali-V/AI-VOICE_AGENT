<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Shivam Voice AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0e1a;
    --panel: rgba(255, 255, 255, 0.04);
    --panel-border: rgba(255, 255, 255, 0.08);
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --text: #e5e7eb;
    --muted: #9ca3af;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 50% at 20% 0%, rgba(99,102,241,0.12), transparent);
    pointer-events: none;
    z-index: 0;
  }
  nav {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(20px);
    background: rgba(10, 14, 26, 0.7);
    border-bottom: 1px solid var(--panel-border);
    padding: 16px 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { font-weight: 700; font-size: 1.1rem; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  nav .right { display: flex; gap: 16px; align-items: center; }
  nav button { background: var(--panel); color: var(--text); border: 1px solid var(--panel-border); padding: 8px 16px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; transition: border-color 0.2s; }
  nav button:hover { border-color: var(--accent); }

  main { position: relative; z-index: 1; padding: 32px; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin-bottom: 8px; letter-spacing: -0.02em; }
  .subtitle { color: var(--muted); margin-bottom: 28px; font-size: 0.95rem; }

  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .stat-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 20px; }
  .stat-card .l { color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
  .stat-card .n { font-size: 1.8rem; font-weight: 700; }

  .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select {
    padding: 10px 14px; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 8px; color: var(--text); font-size: 0.9rem; min-width: 180px;
  }
  .toolbar input:focus, .toolbar select:focus { outline: none; border-color: var(--accent); }
  .toolbar select option { background: #111827; color: var(--text); }
  .toolbar .spacer { flex: 1; }
  .toolbar .refresh {
    padding: 10px 18px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
  }

  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead { background: rgba(0, 0, 0, 0.3); }
  th { text-align: left; padding: 14px 16px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--panel-border); }
  td { padding: 14px 16px; font-size: 0.92rem; border-bottom: 1px solid var(--panel-border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255, 255, 255, 0.02); }
  .pill {
    display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 500;
  }
  .pill.Enrolled { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
  .pill.Demo { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
  .pill.Interested { background: rgba(234, 179, 8, 0.15); color: #facc15; }
  .pill.Busy { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
  .pill.NotInterested { background: rgba(239, 68, 68, 0.15); color: #f87171; }
  .pill.Unknown, .pill.Wrong { background: rgba(156, 163, 175, 0.15); color: var(--muted); }

  .summary-cell { max-width: 340px; color: var(--muted); }
  .expand-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.85rem; padding: 0; margin-left: 6px; }
  .transcript { display: none; margin-top: 8px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 6px; font-size: 0.85rem; white-space: pre-wrap; color: var(--muted); max-height: 300px; overflow-y: auto; }
  .transcript.open { display: block; }

  .state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .spinner { display: inline-block; width: 36px; height: 36px; border: 3px solid var(--panel-border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Config banner */
  .banner {
    background: rgba(234, 179, 8, 0.1);
    border: 1px solid rgba(234, 179, 8, 0.3);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    color: #facc15;
    display: none;
  }
  .banner.show { display: block; }
  .banner code { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>

<nav>
  <div class="brand">Shivam Voice AI</div>
  <div class="right">
    <span id="userLabel" style="color: var(--muted); font-size: 0.9rem;"></span>
    <button onclick="logout()">Sign out</button>
  </div>
</nav>

<main>
  <h1>Call Dashboard</h1>
  <p class="subtitle">Live logs from the Shivam Voice AI call webhook.</p>

  <div id="banner" class="banner">
    Backend not configured. Set <code>API_BASE</code> in <code>dashboard.html</code> to your Railway URL to see live data.
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="l">Total Calls</div><div class="n" id="statTotal">—</div></div>
    <div class="stat-card"><div class="l">Demos Booked</div><div class="n" id="statDemos">—</div></div>
    <div class="stat-card"><div class="l">Enrolled</div><div class="n" id="statEnrolled">—</div></div>
    <div class="stat-card"><div class="l">Total Cost</div><div class="n" id="statCost">—</div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="filterText" placeholder="Search caller or summary..." oninput="render()" />
    <select id="filterOutcome" onchange="render()">
      <option value="">All outcomes</option>
      <option>Enrolled</option>
      <option>Demo Booked</option>
      <option>Interested</option>
      <option>Busy</option>
      <option>Not Interested</option>
      <option>Wrong Number</option>
      <option>Unknown</option>
    </select>
    <div class="spacer"></div>
    <button class="refresh" onclick="loadData()">↻ Refresh</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Caller</th>
          <th>Duration (min)</th>
          <th>Outcome</th>
          <th>Summary</th>
          <th>Cost</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="7"><div class="state"><div class="spinner"></div><div>Loading logs…</div></div></td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
  // ====== CONFIG ======
  // Point this at your deployed backend that exposes GET /api/logs
  // Example: "https://shivam-ai-calls.up.railway.app"
  // Leave empty to disable live data (dashboard will show a banner).
  const API_BASE = "https://shivam-ai-calls-production.up.railway.app";
  const AUTH_TOKEN = "Shivam-Voice-AI";
  // ====================

  // Gate
  const auth = sessionStorage.getItem("svai_auth");
  if (auth !== AUTH_TOKEN) {
    window.location.href = "login.html";
  }
  document.getElementById("userLabel").textContent = "Signed in";

  let rows = [];

  function logout() {
    sessionStorage.removeItem("svai_auth");
    window.location.href = "login.html";
  }

  function pillClass(outcome) {
    if (!outcome) return "Unknown";
    if (outcome.includes("Demo")) return "Demo";
    if (outcome.includes("Not")) return "NotInterested";
    if (outcome.includes("Wrong")) return "Wrong";
    return outcome.replace(/\s+/g, "");
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function render() {
    const q = document.getElementById("filterText").value.toLowerCase();
    const oc = document.getElementById("filterOutcome").value;
    const filtered = rows.filter(r => {
      if (oc && r.outcome !== oc) return false;
      if (q && !(`${r.caller} ${r.summary}`.toLowerCase().includes(q))) return false;
      return true;
    });
    const tbody = document.getElementById("tbody");
    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="state">No matching calls.</div></td></tr>`;
      return;
    }
    tbody.innerHTML = filtered.map((r, i) => `
      <tr>
        <td>${escapeHtml(r.date)}</td>
        <td>${escapeHtml(r.time)}</td>
        <td>${escapeHtml(r.caller)}</td>
        <td>${escapeHtml(r.duration)}</td>
        <td><span class="pill ${pillClass(r.outcome)}">${escapeHtml(r.outcome)}</span></td>
        <td class="summary-cell">
          ${escapeHtml(r.summary)}
          ${r.transcript ? `<button class="expand-btn" onclick="toggleTx(${i})">view transcript</button><div class="transcript" id="tx-${i}">${escapeHtml(r.transcript)}</div>` : ''}
        </td>
        <td>${escapeHtml(r.cost)}</td>
      </tr>
    `).join("");

    // Stats
    document.getElementById("statTotal").textContent = filtered.length;
    document.getElementById("statDemos").textContent = filtered.filter(r => (r.outcome || "").includes("Demo")).length;
    document.getElementById("statEnrolled").textContent = filtered.filter(r => r.outcome === "Enrolled").length;
    const total = filtered.reduce((a, r) => a + (parseFloat(r.cost) || 0), 0);
    document.getElementById("statCost").textContent = "$" + total.toFixed(2);
  }

  function toggleTx(i) {
    const el = document.getElementById("tx-" + i);
    if (el) el.classList.toggle("open");
  }

  async function loadData() {
    if (!API_BASE) {
      document.getElementById("banner").classList.add("show");
      document.getElementById("tbody").innerHTML = `<tr><td colspan="7"><div class="state">Configure <code>API_BASE</code> in dashboard.html to load live data.</div></td></tr>`;
      return;
    }
    document.getElementById("tbody").innerHTML = `<tr><td colspan="7"><div class="state"><div class="spinner"></div><div>Loading logs…</div></div></td></tr>`;
    try {
      const res = await fetch(`${API_BASE}/api/logs`, {
        headers: { "X-Access-Token": AUTH_TOKEN }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      rows = (data.rows || []).slice().reverse(); // newest first
      render();
    } catch (err) {
      document.getElementById("tbody").innerHTML = `<tr><td colspan="7"><div class="state">Failed to load: ${escapeHtml(err.message)}</div></td></tr>`;
    }
  }

  loadData();
</script>
</body>
</html>
