<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — PeakCAT Voice AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0e1a;
    --bg-2: #111827;
    --panel: rgba(255, 255, 255, 0.04);
    --panel-border: rgba(255, 255, 255, 0.08);
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --text: #e5e7eb;
    --muted: #9ca3af;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 0%, rgba(99, 102, 241, 0.18), transparent),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(139, 92, 246, 0.14), transparent);
    pointer-events: none;
    z-index: 0;
  }
  .card {
    position: relative;
    z-index: 1;
    background: var(--bg-2);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 44px 36px;
    width: 100%;
    max-width: 420px;
    backdrop-filter: blur(10px);
  }
  .brand {
    text-align: center;
    font-weight: 700;
    font-size: 1.1rem;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 28px;
    font-size: 0.95rem;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 6px;
    color: var(--muted);
  }
  input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.95rem;
    transition: border-color 0.2s;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.15s;
  }
  button:hover { transform: translateY(-1px); }
  .error {
    color: #f87171;
    font-size: 0.85rem;
    margin-top: 10px;
    min-height: 18px;
    text-align: center;
  }
  .back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
  }
  .back:hover { color: var(--text); }
</style>
</head>
<body>

<div class="card">
  <div class="brand">PeakCAT Voice AI</div>
  <h1>Access Dashboard</h1>
  <p class="subtitle">Sign in to view live call logs.</p>

  <form id="loginForm">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required autofocus />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required />
    </div>
    <button type="submit">Continue</button>
    <div class="error" id="error"></div>
  </form>

  <a class="back" href="index.html">← Back to site</a>
</div>

<script>
  const CREDENTIAL = "Shivam-Voice-AI";
  const form = document.getElementById("loginForm");
  const errorEl = document.getElementById("error");

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();
    if (u === CREDENTIAL && p === CREDENTIAL) {
      sessionStorage.setItem("svai_auth", CREDENTIAL);
      window.location.href = "dashboard.html";
    } else {
      errorEl.textContent = "Wrong username or password";
      document.getElementById("password").value = "";
    }
  });
</script>

</body>
</html>
