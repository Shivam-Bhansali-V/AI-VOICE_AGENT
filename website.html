<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shivam Voice AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  header {
    text-align: center;
    margin-bottom: 40px;
    max-width: 800px;
  }
  header h1 { font-size: 2.5rem; margin-bottom: 12px; }
  header p {
    font-size: 1.1rem;
    line-height: 1.6;
    opacity: 0.9;
  }
  .info {
    background: rgba(255, 255, 255, 0.08);
    padding: 24px 28px;
    border-radius: 12px;
    max-width: 720px;
    margin-bottom: 40px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .info h2 { font-size: 1.3rem; margin-bottom: 10px; }
  .info p { line-height: 1.6; opacity: 0.9; }
  .login-card {
    background: #fff;
    color: #333;
    padding: 36px;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    width: 100%;
    max-width: 380px;
  }
  .login-card h2 {
    text-align: center;
    margin-bottom: 24px;
    color: #1e3c72;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 0.9rem;
    margin-bottom: 6px;
    color: #555;
    font-weight: 500;
  }
  .field input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.2s;
  }
  .field input:focus {
    outline: none;
    border-color: #2a5298;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #2a5298;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }
  button:hover { background: #1e3c72; }
</style>
</head>
<body>
  <header>
    <h1>Shivam Voice AI</h1>
    <p>Automated voice-calling platform for lead engagement and demo booking.</p>
  </header>

  <div class="info">
    <h2>About</h2>
    <p>
      This platform logs and analyses AI-driven calls, captures call outcomes,
      and pushes structured reports into connected sheets in real time. Please
      log in with the provided credentials to continue.
    </p>
  </div>

  <div class="login-card">
    <h2>Login</h2>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button type="submit">Continue</button>
    </form>
  </div>

<script>
  const CREDENTIAL = "Shivam-Voice-AI";
  function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();
    if (u === CREDENTIAL && p === CREDENTIAL) {
      window.location.href = "https://www.google.com";
    } else {
      alert("Wrong username/password");
    }
  }
</script>
</body>
</html>
